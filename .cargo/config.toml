[build]
rustflags = ["--cfg", "tokio_unstable", "-C", "force-frame-pointers=yes"]

[target.wasm32-unknown-unknown]
# Viewer extensions execute untrusted. wasm-ld otherwise leaves memory
# unbounded, which the viewer's pre-compilation policy correctly rejects.
rustflags = ["-C", "link-arg=--max-memory=67108864"]
